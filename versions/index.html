<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>最新 V1.0.12 · 版本目录 · AgriLink 农链</title>
<style>
  :root{--bg:#f4f6fa;--ink:#10151f;--mut:#4d586a;--dim:#64707f;--accent:#1d4ed8;--line:rgba(15,23,42,.10)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);padding:32px 28px 56px;line-height:1.5;
    font-family:'IBM Plex Sans SC','PingFang SC',-apple-system,'Helvetica Neue',sans-serif}
  .wrap{max-width:1100px;margin:0 auto}
  .requirements{position:sticky;top:12px;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;padding:12px 16px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.08);backdrop-filter:blur(10px);font-size:13px;color:var(--mut)}
  .requirements a{font-weight:600;white-space:nowrap}
  h1{font-size:22px;font-weight:600;letter-spacing:.01em}
  .sub{margin-top:6px;font-size:13px;color:var(--mut)}
  .sub code{font-size:12px;color:var(--dim)}
  .tbl{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .row{display:grid;grid-template-columns:112px minmax(0,1fr) 145px 210px;gap:14px;padding:13px 16px;border-top:1px solid var(--line);align-items:baseline}
  .row:first-child{border-top:none}
  .row.head{background:#fbfcff;font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
  .v{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .v.now:after{content:'最新';font-size:10px;font-weight:400;color:#fff;background:var(--accent);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:2px;letter-spacing:.06em}
  .v:not(.now):after{content:'旧';font-size:10px;font-weight:400;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:2px}
  .d{font-size:13px;color:var(--mut)}
  .u{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
  .m{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .m b{font-weight:400;color:var(--accent)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .foot{margin-top:18px;font-size:12px;color:var(--dim);line-height:1.7}
  .foot code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11.5px}
  .base{margin-top:22px;padding:13px 16px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--mut)}
  @media (max-width:760px){.requirements{align-items:flex-start;flex-direction:column;gap:6px}.row{grid-template-columns:1fr;gap:4px}.row.head{display:none}}
.track{margin:26px 0 10px;font-size:13px;letter-spacing:.02em}
</style>
</head>
<body>
<div class="wrap">
  <div class="requirements">
    <span>项目需求文档</span>
    <a target="_blank" rel="noopener noreferrer" href="https://github.com/UpStarData/Project_Design/tree/main/%F0%9F%8C%BE%E5%86%9C%E4%BA%A7%E5%93%81%E4%BA%A4%E6%98%93%E5%A4%A7%E6%A8%A1%E5%9E%8B/%E9%9C%80%E6%B1%82">查看需求文档 →</a>
  </div>
  <h1>AgriLink 农链 · 版本目录</h1>
  <p class="sub">每个版本一个地址，旧版本一直保留 —— 全部在<strong>同一个仓库</strong> <code>UpStarData/agri-llm-demo</code> 里，按版本分目录；<strong>V0.0</strong> 是原版基线（迭代起点），之后每次发版在最新版本上加一个号。</p>
