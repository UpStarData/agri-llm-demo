<!DOCTYPE html>
<html lang="zh-CN" data-theme="color">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AgriLink 农链 · 事实层 / 关联层 / 推演层</title>
<style>/*FONT_CSS*/</style>
<style>/*APP_CSS*/</style>
<style>/*REL_CSS*/</style>
<style>/*SIM_CSS*/</style>
</head>
<body>

<div id="app">
  <!-- G1：顶部轻量工具条（视觉 24px；菜单显隐 · 🌾 AgriLink · 三 TAB · 流水显隐 · 卡片显隐 · 设置） -->
  <header class="topbar">
    <button class="tb-ic" id="menuBtn" aria-label="菜单显隐" aria-pressed="false"></button>
    <div class="brand"><span class="logo" id="logo" aria-hidden="true">🌾</span><b>AgriLink</b><small id="appVer">/*APP_VER*/</small></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="三个一级 TAB"></nav>
    <div class="tb-right">
      <button class="tb-ic" id="btnStream" aria-label="底部流水显隐"></button>
      <button class="tb-ic" id="btnCards" aria-label="右侧面板显隐"></button>
      <button class="tb-ic" id="btnSettings" aria-label="设置"></button>
    </div>
  </header>

  <div class="layout">
    <!-- F2：左侧菜单（从左侧滑出，固定四段：数据概览 / 分类筛选 / 地图快捷控制 / 总开关） -->
    <aside class="menu" id="menu" aria-label="菜单" aria-hidden="true">
      <button class="menu-close" id="menuClose" aria-label="收起菜单">×</button>
      <div class="menu-body" id="menuBody"></div>
    </aside>

    <main id="stage">
      <section class="layer" id="layer-fact" role="tabpanel" aria-label="事实层"></section>
      <section class="layer" id="layer-relation" role="tabpanel" aria-label="关联层"></section>
      <section class="layer" id="layer-sim" role="tabpanel" aria-label="推演层"></section>

      <!-- 快捷键组（地图右下角，两排；含放大 / 缩小） -->
      <div class="mapsk" id="mapSk" role="group" aria-label="地图快捷键"></div>
      <div class="mapzoom" id="mapZoom" role="group" aria-label="地图缩放"></div>

      <!-- V2.9.5：呼出（上）/ 呼入（下）—— 紧贴左侧菜单的右缘，透明无底色 -->
      <div class="fstreams" id="factStreams" aria-label="事实呼出与呼入">
        <section class="fact-stream" id="facts-out" role="region" aria-label="所选日期前30天新增事实">
          <div class="fact-stream-date"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 13V2m-4 4 4-4 4 4" stroke="currentColor"/></svg><time id="outgoing-date"></time></div>
          <div class="fact-viewport"><div class="fact-track"></div><div class="fact-shards" aria-hidden="true"></div></div>
        </section>
        <section class="fact-stream" id="facts-in" role="region" aria-label="所选当天新增事实">
          <div class="fact-stream-date"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v11m-4-4 4 4 4-4" stroke="currentColor"/></svg><time id="incoming-date"></time></div>
          <div class="fact-viewport"><div class="fact-track"></div><div class="fact-shards" aria-hidden="true"></div></div>
        </section>
      </div>

      <!-- V2.9.5：时间轴（日期条 + 范围预设 + 轴）—— 置于底部终端顶部，透明融合，不做深色面板 -->
      <div class="tlbar" id="tlBar" aria-label="时间轴">
        <div class="fact-datebar">
          <div class="fact-date-controls">
            <span class="fact-live-dot" aria-hidden="true"></span>
            <button id="fact-prev" aria-label="前一天">‹</button>
            <input id="fact-date" type="date" aria-label="选择事实日期">
            <button id="fact-next" aria-label="后一天">›</button>
          </div>
          <div class="fact-presets" role="group" aria-label="时间轴范围">
            <button data-fact-range="7" aria-pressed="false">近 7 天</button>
            <button data-fact-range="30" aria-pressed="false">近 30 天</button>
            <button data-fact-range="half" aria-pressed="false">近半年</button>
            <button data-fact-range="year" aria-pressed="false">近 1 年</button>
          </div>
          <div class="tlbar-act"><button id="fact-today" aria-pressed="true">今天</button><button id="fact-play" aria-label="播放时间轴" aria-pressed="false">▷</button></div>
        </div>
        <div class="fact-axis">
          <div class="fact-axis-ticks" aria-hidden="true"></div><div class="fact-axis-selected" aria-hidden="true"></div><div class="fact-axis-line"></div>
          <div class="fact-axis-labels" aria-hidden="true"></div>
          <input id="fact-range" type="range" min="-90" max="0" value="0" step="1" aria-label="拖动时间轴选择日期">
        </div>
      </div>

      <!-- F10 / A5：右侧嵌套抽屉（事实详情 / 本体详情 / 关系详情逐层展开） -->
      <div class="drawer-stack" id="drawerStack"></div>

      <!-- F8：底部处理流水（窄条 · 一行一行向上滚动 · 可关闭 · 无标题） -->
      <div class="stream" id="streamBox">
        <div class="st-bar">
          <span class="st-tab" id="stTabName">接入流</span>
          <span class="st-tab add" title="多 Tab 为本期预留">＋</span>
          <span class="st-meta" id="streamMeta"></span>
        </div>
        <div class="st-body" id="streamBody"></div>
        <button class="st-close" id="streamClose" aria-label="关闭流水">×</button>
      </div>
    </main>
  </div>

  <!-- G1：设置入口（口令 123321；本期空白页） -->
  <div class="pw" id="pwBox" role="dialog" aria-modal="true" aria-label="设置口令">
    <div class="pw-box">
      <div class="pw-t">设置</div>
      <input id="pwInput" type="password" inputmode="numeric" autocomplete="off" placeholder="请输入口令">
      <div class="pw-hint" id="pwHint"></div>
      <div class="pw-act">
        <button class="btn sec" id="pwCancel">取消</button>
        <button class="btn" id="pwOk">进入</button>
      </div>
    </div>
  </div>
  <div class="settings" id="settingsPage">
    <div class="set-box">
      <div class="set-t">设置</div>
      <p>本期设置页为空白页，内容在后续版本填充。</p>
      <button class="btn sec" id="setBack">返回</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<!--BUILD-->
<!--LIBS-->
<!--DATA-->
<!--APP_JS-->
</body>
</html>
