<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriLink 地图实验 · 全球 / 中国 / 湖南</title>
<style>
  :root{
    --ink:#1c2a3a;--mut:#4c5f74;--dim:#7b8b9c;--line:rgba(30,58,92,.16);
    --panel:rgba(255,255,255,.96);--accent:#2f6fd0;--ocean:#5fbdf2;--land:#cfe9bd;
    --globe-sea-1:#6fb6ee;--globe-sea-2:#3a86c8;--globe-sea-3:#0f3c66;
    --globe-space-1:#0a1c33;--globe-space-2:#040c18;--globe-atmo:150,205,255;--globe-star:#eaf4ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#eef2f6;color:var(--ink);font:14px/1.5 "PingFang SC","Noto Sans SC",system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  #chart{position:absolute;inset:0}
  #globe{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none;cursor:grab}
  #globe:active{cursor:grabbing}
  .globe-on #chart{visibility:hidden}
  .globe-on #globe{display:block}

  /* 顶部：视角面包屑 + 层级说明 */
  .topbar{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:14px;padding:0 16px;
    background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);z-index:30}
  .brand{display:flex;align-items:center;gap:7px;font-weight:700}
  .brand span{font-size:18px}
  .crumbs{display:flex;align-items:center;gap:4px;margin-left:6px}
  .crumbs button{border:0;background:transparent;color:var(--dim);font:inherit;font-size:13px;padding:4px 7px;border-radius:6px;cursor:pointer}
  .crumbs button:hover{background:#eef4fc;color:var(--accent)}
  .crumbs button.on{color:var(--ink);font-weight:700;background:#eef4fc}
  .crumbs i{color:#b9c6d4;font-style:normal}
  .scale{margin-left:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}

  /* 右侧：缩放 / 复位 / 3D 切换 */
  .tools{position:absolute;right:16px;top:64px;display:flex;flex-direction:column;gap:8px;z-index:30}
  .tools button{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--panel);
    color:var(--ink);font-size:17px;line-height:1;cursor:pointer;box-shadow:0 6px 18px -12px rgba(16,42,74,.5)}
  .tools button:hover{border-color:var(--accent);color:var(--accent)}
  .tools button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* 底部：提示 + 数据点开关 */
  .hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;
    padding:5px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:12px;white-space:nowrap}
  .legend{position:absolute;left:16px;bottom:16px;z-index:30;padding:9px 12px;border-radius:10px;background:var(--panel);
    border:1px solid var(--line);color:var(--mut);font-size:12px;line-height:1.9}
  .legend b{font-weight:600;color:var(--ink)}
  .legend em{font-style:normal;color:var(--dim)}
  .tip{position:absolute;z-index:40;pointer-events:none;max-width:260px;padding:6px 9px;border-radius:7px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:12px;line-height:1.6;box-shadow:0 10px 26px -16px rgba(16,42,74,.6)}
  .tip span{display:block;color:var(--mut)}
  @media(max-width:600px){
    .topbar{gap:8px;padding:0 10px}.brand b{display:none}.hint{font-size:11px;padding:4px 10px;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
    .legend{display:none}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="chart"></div>
  <canvas id="globe" width="1200" height="900" aria-label="三维地球：拖动旋转、滚轮或双指缩放、点击陆地进入二维全球视角"></canvas>

  <header class="topbar">
    <div class="brand"><span aria-hidden="true">🌾</span><b>AgriLink 地图实验</b></div>
    <nav class="crumbs" id="crumbs" aria-label="视角"></nav>
    <div class="scale" id="scale"></div>
  </header>

  <div class="tools">
    <button id="btn3d" title="三维地球 / 二维地图">3D</button>
    <button id="btnIn" title="放大（也可以按住连续放大）">＋</button>
    <button id="btnOut" title="缩小（也可以按住连续缩小）">－</button>
    <button id="btnReset" title="回到全球视角">⤾</button>
  </div>

  <div class="legend">
    <b>交互</b><br>
    点陆地/省界：进入下一级<br>
    滚轮 · 双指 · ＋/－：连续缩放<br>
    放到上限 / 缩到下限：切视角<br>
    <em>点小圆点 = 查看事实（不切视角）</em>
  </div>
  <div class="hint" id="hint"></div>
  <div class="tip" id="tip" hidden></div>
</div>

<script>/*ECHARTS*/</script>
<script>window.__WORLD110 = /*WORLD*/;</script>
<script>window.__CHINA_GEO = /*CHINA*/;</script>
<script>
/* ============================================================
   独立地图实验页：全球（3D/2D）→ 中国 → 湖南
   只用 ECharts geo（2D）+ 自绘地球（3D），全部离线内联。
   ============================================================ */
(function () {
  const VIEWS = ['globe', 'world', 'china', 'hunan'];
  const LABEL = { globe: '全球 3D', world: '全球 2D', china: '中国', hunan: '湖南' };
  const LEVEL = {
    world: { map: 'worldChina', center: [105, 35], fit: 1.26, bounds: [[-25, 72], [335, -56]], min: 1.1, max: 2.6, inAt: 2.15 },
    china: { map: 'china', center: [104.1, 35.6], fit: 1.0, min: .85, max: 4.0, inAt: 2.6, outAt: .95 },
    hunan: { map: 'china', center: [111.9, 27.4], fit: 5.2, min: 3.4, max: 16, outAt: 3.5 }
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const HUNAM = '湖南';
  const PROV = (window.__CHINA_GEO.features || []).reduce((m, f) => { m[f.properties.name] = f; return m; }, {});

  const state = { view: 'globe', focus: null, center: [105, 35], zoom: 1.26, rotating: true, points: true };
  /* 相机：target 由手势/按钮改，current 每帧向 target 缓动 → 缩放连续、无跳变 */
  const cam = { z: 1.26, tz: 1.26, cx: 105, cy: 35, tcx: 105, tcy: 35, r: .34, tr: .34, busy: false, raf: 0 };
  let chart = null, globe = null;

  /* ---------- 二维地图 ---------- */
  const regionColor = (() => {
    const pal = ['#cfe9bd', '#e2efc6', '#b6dfa4', '#eae7c4', '#c9e6cd', '#d7e4b2', '#bcdcc9', '#e8f0d8'];
    const cache = new Map();
    return name => { if (!cache.has(name)) cache.set(name, pal[cache.size % pal.length]); return cache.get(name); };
  })();
  function mapRegions(level) {
    const names = level === 'world' ? window.__WORLD110.map(x => x.n)
      : (window.__CHINA_GEO.features || []).map(f => f.properties.name);
    return names.flatMap(name => (level === 'world' ? [-1, 0, 1].map(c => (c ? name + '@' + c : name)) : [name])
      .map(n => ({ name: n, itemStyle: { areaColor: regionColor(name) } })));
  }
  /* 世界底图：把跨日期变更线的国家切开（否则平面图上也会粘连） */
  function worldGeoJSON() {
    const raw = window.__WORLD110;
    const depth = x => { let d = 0; while (Array.isArray(x) && x.length) { d++; x = x[0]; } return d; };
    const SEAM = -25;
    const shift = lng => lng < SEAM ? lng + 360 : lng;
    return {
      type: 'FeatureCollection',
      features: raw.map(o => {
        const d = depth(o.c);
        const polys = d >= 4 ? o.c : [d === 3 ? o.c : [o.c]];
        const coordinates = polys.flatMap(poly => {
          const outer = poly[0];
          if (outer.some(p => p[0] < SEAM) && outer.some(p => p[0] >= SEAM)) return [];
          return [poly.map(ring => ring.map(([lng, lat]) => [shift(lng), lat]))];
        });
        return { type: 'Feature', properties: { name: o.n }, geometry: { type: 'MultiPolygon', coordinates } };
      })
    };
  }
  /* 演示数据点：证明「点不切视角」 */
  const POINTS = {
    world: [[116.4, 39.9, '北京新发地农产品批发市场', '市场'], [-0.13, 51.5, '伦敦蔬果批发市场', '市场'], [-74, 40.7, '纽约 Hunts Point 市场', '市场'], [2.35, 48.85, '巴黎 Rungis 市场', '市场']],
    china: [[116.4, 39.9, '北京新发地农产品批发市场', '市场'], [112.98, 28.2, '长沙红星农副产品大市场', '市场'], [121.47, 31.23, '上海江桥批发市场', '市场'], [113.26, 23.13, '广州江南果菜市场', '市场']],
    hunan: [[112.98, 28.2, '长沙红星农副产品大市场', '市场'], [112.98, 28.19, '长沙海吉星农产品市场', '市场'], [111.6, 26.4, '永州蔬菜产区', '产区'], [110.6, 27.3, '怀化水果集散中心', '市场']]
  };
  const pointsOf = v => (state.points ? (POINTS[v] || []) : []);
  const copies = (lng, lat) => state.view === 'world' ? [[lng, lat], [lng + 360, lat], [lng - 360, lat]].filter(p => p[0] > -25 && p[0] < 335) : [[lng, lat]];

  function chartOption() {
    const lv = LEVEL[state.view === 'globe' ? 'world' : state.view];
    state.zoom = cam.z; state.center = [cam.cx, cam.cy];
    const pts = pointsOf(state.view === 'globe' ? 'world' : state.view);
    return {
      backgroundColor: 'transparent',
      animation: false, animationDurationUpdate: 0,
      geo: {
        map: lv.map, roam: true, zoom: state.zoom, center: state.center.slice(),
        zoomOnMouseWheel: false, moveOnMouseMove: true, moveOnMouseWheel: false,
        scaleLimit: { min: lv.min, max: lv.max },
        boundingCoords: state.view === 'world' ? lv.bounds : undefined,
        itemStyle: { areaColor: '#cfe9bd', borderColor: 'rgba(224,128,118,.6)', borderWidth: .7 },
        regions: mapRegions(state.view === 'globe' ? 'world' : state.view),
        emphasis: { itemStyle: { areaColor: '#b6dfa4' }, label: { show: true, color: '#1c2a3a', fontSize: 11, formatter: p => p.name.replace(/@[-\d]+$/, '') } },
        select: { disabled: true }, label: { show: false }
      },
      series: [{
        id: 'pts', type: 'scatter', coordinateSystem: 'geo', z: 6, cursor: 'pointer',
        data: pts.flatMap(([lng, lat, name, kind]) => copies(lng, lat).map(value => ({ value, name, kind }))),
        symbolSize: 9,
        itemStyle: { color: '#fff', borderColor: '#2f6fd0', borderWidth: 2, shadowColor: 'rgba(47,111,208,.55)', shadowBlur: 10 }
      }]
    };
  }
  function mapReady() {
    if (!echarts.getMap('worldChina')) echarts.registerMap('worldChina', worldGeoJSON());
    if (!echarts.getMap('china')) echarts.registerMap('china', window.__CHINA_GEO);
  }
  function ensureChart() {
    if (chart) return chart;
    mapReady();
    chart = echarts.init(document.getElementById('chart'));
    chart.on('click', params => {
      if (params.seriesId === 'pts' && params.data) return showTip(params.data.name, params.data.kind, params.event && params.event.event);
      /* 区域点击：ECharts 只在真正命中多边形时给区域名，点海洋没有任何事件 */
      const name = (params.name || '').replace(/@[-\d]+$/, '');
      if (!name) return;
      drillFrom(name);
    });
    chart.getZr().on('mousemove', e => {
      const p = chart.convertFromPixel({ geoIndex: 0 }, [e.offsetX, e.offsetY]);
      if (p) updateScale(p);
    });
    chart.on('georoam', () => {
      const geo = (chart.getOption().geo || [])[0];
      if (geo) { cam.cx = cam.tcx = geo.center[0]; cam.cy = cam.tcy = geo.center[1]; }
    });
    const box = document.getElementById('chart');
    box.addEventListener('wheel', e => {
      e.preventDefault(); e.stopImmediatePropagation();
      zoomFactor(Math.exp(-e.deltaY * (e.ctrlKey ? .0022 : WHEEL_K)));   /* 触控板捏合更缓 */
    }, { capture: true, passive: false });
    let gBase = 0;
    box.addEventListener('gesturestart', e => { e.preventDefault(); gBase = e.scale || 1; }, { passive: false });
    box.addEventListener('gesturechange', e => {
      e.preventDefault();
      const sc = e.scale || 1, f = gBase ? Math.pow(sc / gBase, .8) : 1;   /* 0.8 次方：手势平缓 */
      gBase = sc;
      zoomFactor(f);
    }, { passive: false });
    box.addEventListener('dblclick', e => {
      const p = chart.convertFromPixel({ geoIndex: 0 }, [e.clientX - box.getBoundingClientRect().left, e.clientY - box.getBoundingClientRect().top]);
      cam.tz = clamp(cam.tz * 1.5, lv.min * .92, lv.max * 1.18);
      if (state.view === 'china' && p) { /* 双击省区：直接进省 */ }
    });
    return chart;
  }

  /* ---------- 视角切换 ---------- */
  function setView(next, focus) {
    const from = VIEWS.indexOf(state.view), to = VIEWS.indexOf(next);
    state.view = next; state.focus = focus || null;
    const lv = LEVEL[next === 'globe' ? 'world' : next];
    const c = focus && PROV[focus] ? provinceCenter(focus) : null;
    state.center = c ? [c[0], c[1]] : lv.center.slice();
    state.zoom = c ? (c[2] || lv.fit) : lv.fit;
    cam.tcx = state.center[0]; cam.tcy = state.center[1];
    cam.tz = state.zoom; cam.z = state.zoom;
    if (next === 'globe') { cam.tr = .34; cam.r = .34; }
    document.getElementById('stage').classList.toggle('globe-on', next === 'globe');
    document.getElementById('btn3d').classList.toggle('on', next === 'globe');
    render();
    if (from !== to) toast('已切到 ' + LABEL[next]);
  }
  let toastTimer = 0;
  function toast(msg) {
    const el = document.getElementById('hint');
    el.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(paintHint, 1400);
  }
  function provinceCenter(name) {
    const f = PROV[name]; if (!f) return null;
    let minLng = 999, maxLng = -999, minLat = 999, maxLat = -999;
    const walk = c => { if (typeof c[0] === 'number') { minLng = Math.min(minLng, c[0]); maxLng = Math.max(maxLng, c[0]); minLat = Math.min(minLat, c[1]); maxLat = Math.max(maxLat, c[1]); } else c.forEach(walk); };
    walk(f.geometry.coordinates);
    const lng = (minLng + maxLng) / 2, lat = (minLat + maxLat) / 2;
    const span = Math.max(maxLng - minLng, (maxLat - minLat) * 1.6);
    return [lng, lat, clamp(360 / Math.max(2, span) * .42, 3.4, 12)];
  }
  function drillFrom(name) {
    if (state.view === 'globe') return setView('world', null);
    if (state.view === 'world') return setView('china', null);
    if (state.view === 'china') {
      if (name === HUNAM) return setView('hunan', HUNAM);
      const c = provinceCenter(name);
      if (!c) return;
      state.view = 'hunan'; state.focus = name; state.center = [c[0], c[1]]; state.zoom = c[2];
      document.getElementById('stage').classList.remove('globe-on');
      render();
      return toast('已切到 ' + name);
    }
  }
  const nextView = () => VIEWS[Math.min(3, VIEWS.indexOf(state.view) + 1)];
  const prevView = () => VIEWS[Math.max(0, VIEWS.indexOf(state.view) - 1)];

  /* ---------- 缩放：目标值连续推进，current 缓动跟随；越过上下限才切视角 ---------- */
  const ZOOM_STEP = 1.09;          /* 按钮/键盘每格 */
  const WHEEL_K = .0016;           /* 滚轮灵敏度（越小越缓） */
  function zoomFactor(factor) {
    if (!Number.isFinite(factor) || factor <= 0) return;
    if (state.view === 'globe') { cam.tr = clamp(cam.tr * factor, .22, .52); return; }
    const lv = LEVEL[state.view];
    /* 允许目标值略微越过上下限，用来触发切层；真正的缩放由缓动完成 */
    cam.tz = clamp(cam.tz * factor, lv.min * .92, lv.max * 1.18);
  }
  const stepZoom = dir => zoomFactor(dir > 0 ? ZOOM_STEP : 1 / ZOOM_STEP);

  function anim() {
    cam.raf = requestAnimationFrame(anim);
    const ease = .16;
    cam.z += (cam.tz - cam.z) * ease;
    cam.cx += (cam.tcx - cam.cx) * ease;
    cam.cy += (cam.tcy - cam.cy) * ease;
    const dr = cam.tr - cam.r;
    if (Math.abs(dr) > 1e-4) { cam.r += dr * ease; if (state.view === 'globe') globeSetR(cam.r); }
    if (state.view === 'globe') {
      if (cam.tr >= .515 && cam.r >= .50) return switchOnZoom(1);   /* 地球放到最大 → 全球 2D */
      return;
    }
    const lv = LEVEL[state.view];
    if (Math.abs(cam.tz - cam.z) > 1e-4 && chart) {
      chart.setOption({ geo: { zoom: cam.z, center: [cam.cx, cam.cy] } }, { lazyUpdate: true });
      paintScale();
    }
    if (cam.tz > lv.max * 1.03 && cam.z > lv.max * .99) return switchOnZoom(1);
    if (cam.tz < lv.min * .97 && cam.z < lv.min * 1.01) return switchOnZoom(-1);
  }
  /* 切视角：短暂淡出 → 换图 → 从接近的比例继续，缩放动势不断 */
  function switchOnZoom(dir) {
    const next = dir > 0 ? nextView() : prevView();
    if (next === state.view) return;
    const keepGoing = dir > 0;
    const box = document.getElementById('chart');
    box.style.transition = 'opacity .16s ease';
    box.style.opacity = '0';
    state.view = next;
    state.focus = next === 'hunan' ? HUNAM : null;
    const lv = LEVEL[next === 'globe' ? 'world' : next];
    const c = state.focus && PROV[state.focus] ? provinceCenter(state.focus) : null;
    cam.tcx = c ? c[0] : lv.center[0];
    cam.tcy = c ? c[1] : lv.center[1];
    cam.tz = keepGoing ? lv.fit * 1.16 : lv.fit * .92;
    cam.z = keepGoing ? lv.fit * .98 : lv.fit * 1.05;
    if (next === 'globe') { cam.tr = .30; cam.r = .40; }
    setTimeout(() => {
      render();
      box.style.opacity = '1';
      toast('已切到 ' + LABEL[next]);
    }, 170);
  }

  /* ---------- 三维地球 ---------- */
  function createGlobe() {
    const canvas = document.getElementById('globe');
    const ctx = canvas.getContext('2d');
    let rot = 105, tilt = .22, R0 = 0.34, drag = null, pause = 0, last = 0, raf = 0, stars = [];
    let seed = 991;
    const rnd = () => ((seed = seed * 16807 % 2147483647) - 1) / 2147483646;
    for (let i = 0; i < 300; i++) stars.push({ x: rnd(), y: rnd(), r: .3 + rnd() * 1.3, a: .2 + rnd() * .6, s: .1 + rnd() * .9 });
    const rad = Math.PI / 180, TAU = Math.PI * 2;
    /* 陆块环线：直接取未平移的原始坐标，并在 ±180 跳变处切开（否则会出现接缝） */
    const rings = [];
    {
      const depth = x => { let d = 0; while (Array.isArray(x) && x.length) { d++; x = x[0]; } return d; };
      window.__WORLD110.forEach(o => {
        const d = depth(o.c);
        const polys = d >= 4 ? o.c : [d === 3 ? o.c : [o.c]];
        polys.forEach(poly => {
          const ring = poly[0]; if (!ring || ring.length < 3) return;
          const parts = [[]];
          for (let i = 0; i < ring.length; i++) {
            const cur = ring[i], prev = ring[i - 1];
            if (i > 0 && Math.abs(cur[0] - prev[0]) > 180) {
              const west = prev[0] > 0 ? 180 : -180;
              const lat = (prev[1] + cur[1]) / 2;
              parts[parts.length - 1].push([west, lat]);
              parts.push([[-west, lat]]);
            }
            parts[parts.length - 1].push(cur);
          }
          parts.filter(r => r.length >= 3).forEach(r => rings.push({ name: o.n, ring: r }));
        });
      });
    }
    const project = (lng, lat, cx, cy, R) => {
      const lam = (lng - rot) * rad, phi = lat * rad;
      const x = Math.cos(phi) * Math.sin(lam), y = Math.sin(phi), z = Math.cos(phi) * Math.cos(lam);
      return { x: cx + R * x, y: cy - R * (y * Math.cos(tilt) - z * Math.sin(tilt)), z: y * Math.sin(tilt) + z * Math.cos(tilt) };
    };
    /* 屏幕点 → 球面经纬：联立 y3·c − z3·s = v 与 u²+y3²+z3²=1，取朝向观察者的根 */
    const lngLatAt = (px, py, cx, cy, R) => {
      const u = (px - cx) / R, v = -(py - cy) / R;
      if (u * u + v * v > 1) return null;
      const c = Math.cos(tilt), s = Math.sin(tilt);
      const C = u * u * c * c + v * v - c * c;
      const disc = v * v * s * s - C;
      if (disc < 0) return null;
      const z3 = -v * s + Math.sqrt(disc);
      const y3 = (v + z3 * s) / c;
      const lat = Math.asin(clamp(y3, -1, 1)) / rad;
      const lam = Math.atan2(u, z3);
      return [((lam / rad + rot) + 540) % 360 - 180, lat];
    };
    const inside = (pt, ring) => {
      let ins = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i], [xj, yj] = ring[j];
        if (((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi)) ins = !ins;
      }
      return ins;
    };
    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = canvas.clientWidth || 1200, h = canvas.clientHeight || 900;
      if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function draw(now) {
      const w = canvas.clientWidth, h = canvas.clientHeight, cx = w / 2, cy = h / 2, R = Math.min(w, h) * globeR();
      const css = getComputedStyle(document.documentElement);
      const v = n => css.getPropertyValue(n).trim();
      const space1 = v('--globe-space-1') || '#0a1c33', space2 = v('--globe-space-2') || '#040c18';
      ctx.clearRect(0, 0, w, h);
      const sky = ctx.createLinearGradient(0, 0, w * .6, h);
      sky.addColorStop(0, space1); sky.addColorStop(1, space2); ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
      stars.forEach(s => {
        ctx.globalAlpha = s.a * (.6 + .4 * Math.sin(now * .0011 * s.s + s.x * 26));
        ctx.fillStyle = v('--globe-star') || '#eaf4ff';
        ctx.beginPath(); ctx.arc(((s.x + (now * .000004 * s.s) + 1) % 1) * w, s.y * h, s.r, 0, TAU); ctx.fill();
      });
      ctx.globalAlpha = 1;
      const atmo = (v('--globe-atmo') || '150,205,255');
      const haze = ctx.createRadialGradient(cx, cy, R, cx, cy, R * 1.16);
      haze.addColorStop(0, 'rgba(' + atmo + ',.3)'); haze.addColorStop(1, 'rgba(' + atmo + ',0)');
      ctx.beginPath(); ctx.arc(cx, cy, R * 1.16, 0, TAU); ctx.arc(cx, cy, R, 0, TAU, true); ctx.fillStyle = haze; ctx.fill('evenodd');
      const sea = ctx.createRadialGradient(cx - R * .34, cy - R * .42, R * .06, cx, cy, R * 1.1);
      sea.addColorStop(0, v('--globe-sea-1') || '#6fb6ee'); sea.addColorStop(.55, v('--globe-sea-2') || '#3a86c8'); sea.addColorStop(1, v('--globe-sea-3') || '#0f3c66');
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fillStyle = sea; ctx.fill();
      ctx.save(); ctx.clip();
      rings.forEach(({ name, ring }) => {
        let run = [];
        const flush = () => {
          if (run.length < 3) { run = []; return; }
          ctx.beginPath(); run.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath();
          ctx.fillStyle = regionColor(name); ctx.globalAlpha = .95; ctx.fill(); ctx.globalAlpha = 1;
          ctx.strokeStyle = 'rgba(224,128,118,.5)'; ctx.lineWidth = .6; ctx.stroke(); run = [];
        };
        ring.forEach(([lng, lat]) => { const p = project(lng, lat, cx, cy, R); if (p.z > 0) run.push(p); else flush(); });
        flush();
      });
      /* 演示点：白色小点（点它只看事实，不切视角） */
      pointsOf('world').forEach(([lng, lat, name, kind]) => {
        const p = project(lng, lat, cx, cy, R); if (p.z <= 0) return;
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 12);
        g.addColorStop(0, 'rgba(47,111,208,.35)'); g.addColorStop(1, 'rgba(47,111,208,0)');
        ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, TAU); ctx.fillStyle = g; ctx.fill();
        ctx.beginPath(); ctx.arc(p.x, p.y, 3.2, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
        ctx.strokeStyle = '#2f6fd0'; ctx.lineWidth = 1.4; ctx.stroke();
        canvas._hits = canvas._hits || []; canvas._hits.push({ x: p.x, y: p.y, name, kind });
      });
      const term = ctx.createLinearGradient(cx + R * .7, cy - R * .7, cx - R * .7, cy + R * .7);
      term.addColorStop(0, 'rgba(0,0,0,0)'); term.addColorStop(1, 'rgba(4,12,24,.32)');
      ctx.fillStyle = term; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
      ctx.restore();
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
      ctx.strokeStyle = 'rgba(' + atmo + ',.6)'; ctx.lineWidth = 1.6; ctx.shadowColor = 'rgba(' + atmo + ',.7)'; ctx.shadowBlur = 10; ctx.stroke(); ctx.shadowBlur = 0;
    }
    function loop(now) {
      raf = requestAnimationFrame(loop);
      if (state.view !== 'globe') { cancelAnimationFrame(raf); raf = 0; return; }
      if (now - last < 33) return;
      last = now;
      if (!drag && now > pause) rot = (rot + .09) % 360;
      resize();
      canvas._hits = [];
      draw(now);
      paintChrome();
    }
    function start() { resize(); if (!raf) raf = requestAnimationFrame(loop); }
    canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: false }; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.moved ||= Math.abs(dx) + Math.abs(dy) > 3;
      rot = (rot - dx * .38 + 360) % 360;
      tilt = clamp(tilt + dy * .003, -.5, .5);
      drag.x = e.clientX; drag.y = e.clientY; pause = performance.now() + 2200;
    });
    canvas.addEventListener('pointerup', e => {
      if (!drag) return;
      const moved = drag.moved; drag = null;
      if (moved) return;
      const r = canvas.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      const hit = (canvas._hits || []).find(p => Math.hypot(p.x - x, p.y - y) < 11);
      if (hit) return showTip(hit.name, hit.kind, e);
      /* 只认陆地：点在海洋什么都不做 */
      const w = canvas.clientWidth, h = canvas.clientHeight, R = Math.min(w, h) * globeR();
      const ll = lngLatAt(x, y, w / 2, h / 2, R);
      if (!ll) return;
      const onLand = rings.some(({ ring }) => inside(ll, ring));
      if (!onLand) return toast('这里是海洋，点陆地才会进入二维全球视角');
      setView('world', null);
    });
    canvas.addEventListener('wheel', e => { e.preventDefault(); zoomFactor(Math.exp(-e.deltaY * .0016)); }, { passive: false });
    window.addEventListener('resize', () => { if (state.view === 'globe') resize(); });
    function probe(x, y) {
      const w = canvas.clientWidth, h = canvas.clientHeight, R = Math.min(w, h) * globeR();
      const ll = lngLatAt(x, y, w / 2, h / 2, R);
      const hit = (canvas._hits || []).find(p => Math.hypot(p.x - x, p.y - y) < 11);
      return { ll, hit: hit ? hit.name : null, land: ll ? rings.some(({ ring }) => inside(ll, ring)) : false, rot, tilt };
    }
    return { start, probe, debug: () => ({ rot, tilt, R0 }) };
  }
  const globeR = () => globe._r || .34;
  const globeSetR = v => { globe._r = v; };

  /* ---------- 交互：按钮 / 键盘 ---------- */
  function bindUI() {
    const hold = dir => {
      let rep = 0; const delay = setTimeout(() => { rep = setInterval(() => stepZoom(dir), 220); }, 420);
      stepZoom(dir);
      const stop = () => { clearTimeout(delay); clearInterval(rep); window.removeEventListener('pointerup', stop); };
      window.addEventListener('pointerup', stop);
    };
    const inBtn = document.getElementById('btnIn'), outBtn = document.getElementById('btnOut');
    inBtn.addEventListener('pointerdown', e => { e.preventDefault(); hold(1); });
    outBtn.addEventListener('pointerdown', e => { e.preventDefault(); hold(-1); });
    document.getElementById('btn3d').addEventListener('click', () => setView(state.view === 'globe' ? 'world' : 'globe', null));
    document.getElementById('btnReset').addEventListener('click', () => setView('globe', null));
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') { if (state.view !== 'globe') setView(prevView(), null); return; }
      if (e.key === '+' || e.key === '=') return stepZoom(1);
      if (e.key === '-') return stepZoom(-1);
      if (e.key === '1') return setView('globe', null);
      if (e.key === '2') return setView('world', null);
      if (e.key === '3') return setView('china', null);
      if (e.key === '4') return setView('hunan', HUMANE());
    });
  }
  const HUMANE = () => HUNAM;

  /* ---------- 顶部 / 底部状态 ---------- */
  function paintChrome() {
    const crumbs = document.getElementById('crumbs');
    const at = state.view === 'globe' ? 0 : state.view === 'world' ? 1 : state.view === 'china' ? 2 : 3;
    const items = [['globe', '全球 3D'], ['world', '全球 2D'], ['china', '中国'], ['hunan', state.focus && state.focus !== '湖南' ? state.focus : '湖南']];
    crumbs.innerHTML = items.slice(0, at + 1).map(([v, n], i) => '<button data-v="' + v + '"' + (i === at ? ' class="on"' : '') + '>' + n + '</button>').join('<i>›</i>');
    crumbs.querySelectorAll('button').forEach(b => { b.onclick = () => setView(b.dataset.v, b.dataset.v === 'hunan' ? '湖南' : null); });
    paintScale();
    paintHint();
  }
  function paintScale() {
    document.getElementById('scale').textContent = state.view === 'globe'
      ? '地球半径 ' + (globeR() * 100).toFixed(0) + '%'
      : '比例 ' + cam.z.toFixed(2) + '×';
  }
  function paintHint() {
    const el = document.getElementById('hint');
    el.textContent = state.view === 'globe' ? '拖动旋转 · 滚轮/双指缩放 · 点陆地进入二维全球（点小圆点看事实）'
      : state.view === 'world' ? '点任意国家进入中国视角 · 放到上限自动进入 · 缩到下限回三维地球'
      : state.view === 'china' ? '点任意省份进入省区视角 · 放到上限自动进入湖南 · 缩到下限回全球'
      : '缩到下限或按 Esc 回到中国视角 · 顶部面包屑可跳任意层级';
  }
  function updateScale(p) { /* 保留：后续可在光标处显示经纬 */ }

  /* ---------- 提示气泡 ---------- */
  let tipTimer = 0;
  function showTip(name, kind, ev) {
    const el = document.getElementById('tip');
    el.innerHTML = '<b>' + name + '</b><span>' + (kind || '') + ' · 演示点</span>';
    el.hidden = false;
    const x = ev ? ev.clientX : 0, y = ev ? ev.clientY : 0;
    el.style.left = Math.max(8, Math.min(window.innerWidth - 270, x + 14)) + 'px';
    el.style.top = Math.max(56, y + 14) + 'px';
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => { el.hidden = true; }, 2200);
  }

  function render() {
    document.getElementById('stage').classList.toggle('globe-on', state.view === 'globe');
    document.getElementById('btn3d').classList.toggle('on', state.view === 'globe');
    if (state.view === 'globe') { globe.start(); paintChrome(); return; }
    const c = ensureChart();
    c.resize();
    c.setOption(chartOption(), { notMerge: true });
    paintChrome();
    const zr = c.getZr(); if (zr.animation) zr.animation.start();
  }

  globe = createGlobe();
  globe._r = .34;
  requestAnimationFrame(anim);
  bindUI();
  render();
  window.__MAPLAB_READY = true;
  window.__maplab = {
    view: () => state.view, state, setView, stepZoom, zoomFactor, globe
  };
})();
</script>
</body>
</html>
